name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1.0.0
    with:
      stack: nextjs-passenger
      app_path: frontend
      deploy_path: /home/manoohpq/peci-ci.com
      health_check_url: https://peci-ci.com
      protect_paths: |
        backend
      build_env: |
        NEXT_PUBLIC_API_URL=https://backend.peci-ci.com/api
        NEXT_PUBLIC_SITE_URL=https://peci-ci.com
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
