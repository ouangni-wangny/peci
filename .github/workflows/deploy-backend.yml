name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-backend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1.3.0
    with:
      stack: laravel
      app_path: backend
      # cPanel crée le sous-domaine backend.peci-ci.com dans ce dossier
      # (Domains → peci-ci.com/backend), pas dans un dossier séparé.
      deploy_path: /home/manoohpq/peci-ci.com/backend
      health_check_url: https://backend.peci-ci.com/up
      # Serveur CloudLinux : /usr/bin/php ne correspond pas à la version
      # sélectionnée pour le compte (8.4) — voir xsel-deploy-mutualise README.
      php_bin: /opt/alt/php84/usr/bin/php
      composer_bin: /opt/alt/php84/usr/bin/composer
      # v1.1.x : comportement de PECI volontairement inchangé (en production,
      # validé). Passer à false / true pour adopter le build CI (vendor livré)
      # et l'alignement automatique du PHP web — voir ADR-0007 du kit.
      composer_on_server: true
      manage_web_php: false
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
