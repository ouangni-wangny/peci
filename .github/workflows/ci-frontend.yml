name: CI frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  # Permet à deploy-frontend.yml de l'appeler via `uses: ./.github/workflows/ci-frontend.yml`
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `next build` type-checke déjà tout le projet (y compris les types de
      # routes générés comme LayoutProps, absents avant ce build) — un
      # `tsc --noEmit` séparé avant le build échouerait sur ces types.
      - run: npm run build
